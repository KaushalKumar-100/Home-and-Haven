name: Automation tests

on:
  pull_request:
    paths:
      - "automation/**"
      - ".github/workflows/automation-tests.yml"
  push:
    branches:
      - automation-hardening
    paths:
      - "automation/**"
      - ".github/workflows/automation-tests.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r automation/requirements.txt pytest
      - name: Run automation unit tests
        run: python -m pytest -q automation
